services:

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080" # Web UI
      - "50000:50000" # Agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped
    user: root

  frontend:
    depends_on:
      - employee-backend
      - manager-backend
    build: ./web_app
    ports:
      - "5173:5173"

  employee-backend:
    build: ./employee_app
    ports:
      - "7070:7070"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"

  manager-backend:
    build: ./manager_app
    ports:
      - "9090:9090"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"

volumes:
  sqlite_data:
  jenkins_home:

services:

  frontend:
    depends_on:
      - employee-backend
      - manager-backend
    build: ./web_app
    ports:
      - "5173:5173"

  employee-backend:
    build: ./employee_app
    ports:
      - "7070:7070"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"
      SELENIUM_URL: "http://selenium:4444/wd/hub"

  manager-backend:
    build: ./manager_app
    ports:
      - "9090:9090"
    volumes:
      - "sqlite_data:/var/lib/sqlite/data"
    environment:
      DATABASE_URL: "/var/lib/sqlite/data/expenses_system_db.db"
      CONTAINER: "DOCKER"
      SELENIUM_URL: "http://selenium:4444/wd/hub"

  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: "2gb"
    ports:
      - "4444:4444"
      - "7900:7900"

volumes:
  sqlite_data:

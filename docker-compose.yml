services:

  frontend:
    depends_on:
      - employee-backend
      - manager-backend
    build: ./web_app
    ports:
      - "5173:5173"

  employee-backend:
    build: ./employee_app
    ports:
      - "7070:7070"
    volumes:
      - "sqlite_data:/var/data"
    environment:
      DATABASE_URL: "/var/data/expenses_system_db.db"
      CONTAINER: "DOCKER"
      BASE_URL: "http://frontend:5173"
      SELENIUM_URL: "http://selenium:4444/wd/hub"

  manager-backend:
    build: ./manager_app
    ports:
      - "9090:9090"
    volumes:
      - "sqlite_data:/var/data"
    environment:
      DATABASE_URL: "/var/data/expenses_system_db.db"
      CONTAINER: "DOCKER"
  
  selenium:
    image: selenium/standalone-chrome
    platform: linux/amd64
    ports:
      - "4444:4444"
      
volumes:
  sqlite_data:
